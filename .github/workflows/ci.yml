name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter idas-web check && pnpm --filter idas-web build
      - run: pnpm schema && git diff --exit-code -- docs/idss.schema.json
      - if: matrix.node == 24
        uses: oven-sh/setup-bun@v2
      - if: matrix.node == 24
        run: pnpm test:bun
      - if: matrix.node == 24
        run: |
          export IDAS_SANDBOX_IMAGE="$(docker build -q tests/sandbox)"
          IDAS_TEST_SECRET=host-only node --test tests/adapters.test.mjs
      - run: bash scripts/pack.sh "${{ runner.temp }}/idas-packages"
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path packages/sdk-swift
      - run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -typecheck -parse-as-library -target arm64-apple-ios16.0-simulator -sdk "$sdk" packages/sdk-swift/Sources/IDAS/*.swift
